<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folding crate</title>
<style>
  :root {
    --ease: cubic-bezier(0.2, 0, 0, 1);
    --hover-ms: 140ms;
    --fold-ms: 340ms;
    --bg: #14161a;
    --ink: #e9ecf1;
    --muted: #9aa3b0;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f4f2ee; --ink:#1b1d21; --muted:#6b7280; }
  }
  :root[data-theme="light"] { --bg:#f4f2ee; --ink:#1b1d21; --muted:#6b7280; }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; background: var(--bg); color: var(--ink);
    display: grid; place-items: center; gap: 0; padding: 16px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage { display: grid; justify-items: center; gap: 22px; }

  /* The button is the control; the SVG inside is purely presentational.
     Keeping it a real button means keyboard, focus ring and AT come free. */
  .crate-button {
    appearance: none; background: none; border: 0; padding: 0; cursor: pointer;
    width: min(62vw, 300px); aspect-ratio: 1; display: block;
    border-radius: 18px;
    -webkit-tap-highlight-color: transparent;
  }
  .crate-button:focus-visible {
    outline: 2px solid currentColor; outline-offset: 6px;
  }

  .crate { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Hover: affordance only. This is seen often, so it stays near the
     threshold of perception -- a lift and a tighter shadow, nothing more. */
  .lift {
    transition: transform var(--hover-ms) var(--ease),
                filter var(--hover-ms) var(--ease);
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.30));
    transform: translateY(0);
  }
  @media (hover: hover) and (pointer: fine) {
    .crate-button:hover .lift {
      transform: translateY(-7px);
      filter: drop-shadow(0 20px 30px rgba(0,0,0,.38));
    }
  }
  .crate-button:active .lift { transform: translateY(-2px) scale(0.985); }

  /* Click: the explanation. A folding crate folds flat -- the walls come in
     first, then the whole body collapses onto its base. Staged, because that
     is the order the real object does it in. */
  .fold {
    transform-origin: 50% 84%;
    transition: transform var(--fold-ms) var(--ease);
  }
  /* No separate wall animation. A folding crate keeps its footprint and
     loses its height, so the vertical collapse IS the fold -- and the walls
     sit inside the shell clip, where collapsing them only reveals body
     colour. Motion that carries no meaning is motion to delete. */

  [data-folded="true"] .fold { transform: scaleY(0.34); }

  /* The walls lead the body by a beat going down, and follow it coming back
     up -- so it reads as folding rather than simply squashing. */
  [data-folded="true"] .fold { transition-delay: 70ms; }
  [data-folded="true"] .lift { filter: drop-shadow(0 6px 10px rgba(0,0,0,.34)); }

  /* Motion is never the only channel: the label says the state outright. */
  .state {
    margin: 0; font-size: 13px; letter-spacing: .01em; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .state b { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .lift, .fold {
      transition-duration: 1ms !important; transition-delay: 0ms !important;
    }
    .crate-button:hover .lift { transform: none; }
  }
</style></head>

<script>
  const btn = document.getElementById('btn');
  const word = document.getElementById('word');
  const state = document.getElementById('state');
  btn.addEventListener('click', () => {
    const folded = btn.dataset.folded !== 'true';
    btn.dataset.folded = String(folded);
    btn.setAttribute('aria-pressed', String(folded));
    word.textContent = folded ? 'folded flat' : 'assembled';
    state.lastChild.textContent = folded ? ' \u00b7 click to unfold' : ' \u00b7 click to fold flat';
  });
</script>
