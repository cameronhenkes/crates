<!doctype html><html><head><meta charset="utf-8"><title>capture</title>
<style>html,body{margin:0;background:#000}#stage{position:absolute;left:-9999px;top:0}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script></head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<div id="stage"></div>
<!-- Renders a scene one frame at a time and posts each frame to capture.py. Nothing here runs
     in real time: every frame is a position, painted and saved, so the video is exactly the
     animation and never a recording of how fast this machine drew it. -->
<script type="module">
import * as THREE from "three";
import { createCrateFold } from "../interactive/fold/crate-fold.js";
import { drawItem } from "../interactive/fold/crate-items.js";

const q = new URLSearchParams(location.search), scene = q.get("scene") || "fold";
// The page the animation is shown on: blank, light or dark. No picture behind it; the video is
// of the object, and a backdrop competes with it.
const page = q.get("page") === "dark" ? "dark" : "light";
const PAGE = { light: { bg: "#FFFFFF", brightness: 2 }, dark: { bg: "#14161A", brightness: 1 } }[page];
const name = page === "dark" ? scene + "-dark" : scene;
const FPS = 60, W = 1920, H = 1080;
const out = document.getElementById("out"), x = out.getContext("2d");
const TEX = { "front.png": "../interactive/fold/tex/front.png", "back.png": "../interactive/fold/tex/back.png",
              "side.png": "../interactive/fold/tex/side.png", "floor.png": "../interactive/fold/tex/floor.png" };

const SCENES = {
  fold:    { view: "front",   size: 880 },
  records: { view: "records", size: 740 },
};
const S = SCENES[scene];
const ready = Promise.withResolvers();
const fold = createCrateFold({ THREE, mount: document.getElementById("stage"), size: S.size, view: S.view, brightness: PAGE.brightness,
                               textures: TEX, onReady: ready.resolve });
await ready.promise;
const gl = document.querySelector("#stage canvas");

function paint(){
  x.fillStyle = PAGE.bg; x.fillRect(0, 0, W, H);
  const w = S.size, h = Math.round(S.size / fold.aspect);
  x.drawImage(gl, Math.round((W - w) / 2), Math.round((H - h) / 2), w, h);
}
async function save(i){
  const blob = await new Promise(r => out.toBlob(r, "image/png"));
  await fetch(`/frame/${name}/${String(i).padStart(5, "0")}`, { method: "POST", body: blob });
}

// ---- timelines: a list of [seconds, paint-at(k)] beats, k running 0..1 within the beat
const beats = [];
const hold = (s, at) => beats.push([s, () => at()]);
if (scene === "fold") {
  const T = fold.duration / 1000;
  hold(0.8, () => fold.set(0));
  beats.push([T, k => fold.set(k)]);
  hold(1.0, () => fold.set(1));
  beats.push([T, k => fold.set(1 - k)]);
  hold(0.8, () => fold.set(0));
} else {
  const n = 6, F = fold.flipDuration / 1000;
  fold.setRecords(Array.from({ length: n }, (_, i) => drawItem({ crate: "#C0614B", index: i, fold })));
  let at = -1;
  hold(0.8, () => fold.seek({ to: -1 }));
  for (const to of [0, 1, 2, 3, 4, 5, 2, -1]) {
    const from = at;
    beats.push([F, k => fold.seek({ from, to, k })]);
    hold(to === -1 ? 0.9 : 0.55, () => fold.seek({ to }));
    at = to;
  }
}
let i = 0;
for (const [secs, at] of beats) {
  const frames = Math.round(secs * FPS);
  for (let f = 0; f < frames; f++) { at(frames > 1 ? f / (frames - 1) : 1); paint(); await save(i++); }
}
await fetch(`/done/${name}/${i}`, { method: "POST" });
document.title = "done " + i;
</script></body></html>
