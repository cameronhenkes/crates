<h1>The icon is the front of the crate
 <small>Click it. Front folds back, then the back, then left, then right.</small></h1>
<button id="wrap" aria-pressed="false" aria-label="Fold the crate"></button>
<pre id="diag" style="margin:0;font:11px ui-monospace,Menlo,monospace;color:#7c8794;white-space:pre-wrap;max-width:560px"></pre>
<p class="state" id="state">Crate is <b>closed</b> &middot; click to fold</p>
<script type="module">
import * as THREE from "three";
const diag = m => { const d=document.getElementById("diag"); if(d) d.textContent += m + "\n"; };
window.addEventListener("error", e => diag("ERROR: " + e.message));
diag("three " + THREE.REVISION + " loaded");

const W = 900, H = 684, D = 720;   // the front face is the icon, tab and all
// The icon is a FOLDER: its tab rises 96 above the body. The crate box is the
// body only, so the other three walls are shorter and the tab overhangs them,
// exactly as a folder tab overhangs. Sizing every wall to the full height was
// what pushed the sides proud of the front at the corners.
const BODY_TOP = 96, HB = H - BODY_TOP;
// The front's silhouette is rounded (r=62), so its outline pulls in at every
// corner. A flat side wall parked at the extreme edge leaves its square
// corner sticking into that gap -- the wedge Cameron kept seeing. On a real
// crate the front and back wrap the sides, so the sides sit inboard and the
// rounded corner covers the joint. INSET is that overlap.
const R = 62, INSET = R * 0.62, DEPTH_IN = R * 0.62;
const SIZE = 460;

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(SIZE, SIZE);
document.getElementById("wrap").appendChild(renderer.domElement);
diag("renderer ok, ctx=" + (renderer.getContext() ? "yes" : "NO"));

// Low FOV from far away reads as near-orthographic, so the resting frame is
// the icon rather than a photograph of it.
const camera = new THREE.PerspectiveCamera(17, 1, 10, 12000);
scene.add(new THREE.AmbientLight(0xffffff, 0.92));
const key = new THREE.DirectionalLight(0xffffff, 0.45);
key.position.set(-500, 900, 1200); scene.add(key);

const manager = new THREE.LoadingManager();
const loader = new THREE.TextureLoader(manager);
// Interior faces sit inside a crate, so they are in shade. Without this the
// back wall is as bright as the front, you see two identical grids stacked,
// and it reads as confusion rather than depth.
function mat(url, shade, flipX){
  const t = loader.load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  // A box's -z face carries mirrored UVs, so rotating the mesh to correct a
  // mirrored back just cancels out. Flipping the texture itself is the only
  // thing that actually moves the folder tab back to the correct side.
  if (flipX) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.offset.x = 1; }
  // alphaTest rather than blending: the fragment shader discards transparent
  // pixels, so the depth buffer stays authoritative and the perforations are
  // genuinely see-through at every angle. This is the thing CSS could not do.
  return new THREE.MeshLambertMaterial({
    map:t, transparent:true, alphaTest:0.5, side:THREE.DoubleSide,
    color: shade ? 0x9a9a9a : 0xffffff,
    // Folded walls end up almost coplanar with the floor and each other.
    // Without a depth bias the fragments tie and flicker frame to frame --
    // that is the jitter. polygonOffset breaks the tie in the depth test.
    polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-1 });
}

/** A wall hinged on a base edge. The pivot sits ON the hinge; the plane is
 *  offset so it stands up from it, so rotating the pivot IS the fold. */
// Walls are boxes, not planes. A zero-thickness plane reads as paper at
// every angle except dead-on, and the folded stack has no layers to it --
// which is what made the crate look nothing like the moulded original.
const TH = 13;                    // wall thickness, ~1.4% of the crate width
function wall(w, h, url, hinge, rot, lift, shade, flipX){
  const pivot = new THREE.Group();
  pivot.position.copy(hinge);
  // Real walls have thickness, so a folded crate is a stack, not a pile of
  // coincident planes. Lifting each wall by the thickness of the ones that
  // folded before it gives the correct stacking order AND separates them in
  // depth, which is the other half of the jitter fix.
  pivot.position.y += lift || 0;
  // NOT a box. A box's edge faces are solid rectangles that ignore the
  // texture's alpha cutout, so the folder silhouette ended up wrapped in a
  // rectangular bar -- which is where the phantom second tab came from.
  // Two textured faces TH apart keep the cutout and still read as thickness
  // at every angle except dead-on.
  const mesh = new THREE.Group();
  const g = new THREE.PlaneGeometry(w, h);
  const outer = new THREE.Mesh(g, mat(url, shade, flipX));
  outer.position.z = TH / 2;
  const inner = new THREE.Mesh(g, mat(url, shade, flipX));
  inner.position.z = -TH / 2;
  mesh.add(outer, inner);
  mesh.position.set(0, h/2, 0);
  if (rot) mesh.rotation.y = rot;
  pivot.add(mesh);
  scene.add(pivot);
  return pivot;
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(W - INSET*0.6, D - INSET*0.6), mat(TEX["floor.png"], true));
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// Walls have thickness, so a folded crate is a stack. Each wall is lifted
// by the thickness of the ones that fold before it: correct stacking order,
// and it separates them in depth so coplanar fragments stop fighting.
const T = TH;   // stack spacing IS the wall thickness
const front = wall(W, H, TEX["front.png"], new THREE.Vector3(0,0, D/2), 0, T*1, false);
// Front and back are the same moulding. But seen from inside, the artwork
// mirrors -- and on a FOLDER that puts the tab on the wrong side, so at rest
// you saw two tabs and a broken silhouette. Turning the back 180 degrees
// about Y presents the moulding the same way round, so its tab sits behind
// the front's instead of beside it.
// same moulding as the front, cropped to the body -- no second tab
const back  = wall(W, HB, TEX["back.png"], new THREE.Vector3(0,0,-D/2), 0, T*2, true);
const left  = wall(D - DEPTH_IN*2, HB, TEX["side.png"], new THREE.Vector3(-W/2 + INSET,0,0), Math.PI/2, T*3, true);
const right = wall(D - DEPTH_IN*2, HB, TEX["side.png"], new THREE.Vector3( W/2 - INSET,0,0), Math.PI/2, T*4, true);

// Folding inward, derived: front +Y must reach -Z (rot.x -90); back +Y must
// reach +Z (+90); left +Y must reach +X (rot.z -90); right +Y to -X (+90).
const BEATS = [
  {o:front, axis:"x", to:-Math.PI/2, at:0.00},
  {o:back,  axis:"x", to: Math.PI/2, at:0.26},
  {o:left,  axis:"z", to:-Math.PI/2, at:0.50},
  {o:right, axis:"z", to: Math.PI/2, at:0.74},
];
const SPAN = 0.26;

// ease-out cubic is heavily front-loaded: 90% done at 54% through. On a
// four-beat sequence that makes each wall snap and then wait, which reads
// as a jump rather than a fold. ease-in-out spends the time in the middle,
// where the motion actually is.
const ease = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

function apply(t){
  for (const b of BEATS){
    b.o.rotation[b.axis] = b.to * ease(clamp01((t - b.at) / SPAN));
  }
  // The camera lifts across the WHOLE fold, not the first half. Reaching
  // its final angle by 55% meant the viewpoint had stopped moving while
  // three of the four walls were still folding, so the back half of the
  // animation happened in a static frame.
  const c = ease(t);
  const dist = 3400 + 500*c;
  const el = (5 + 32*c) * Math.PI/180;
  camera.position.set(0, H*0.42 + Math.sin(el)*dist, Math.cos(el)*dist + D/2);
  camera.lookAt(0, H*0.40*(1-c), c*(-D*0.10));
  renderer.render(scene, camera);
}

let t = 0, target = 0, raf = null, last = 0;
const DUR = 1500;
function run(now){
  if (!last) last = now;
  const dt = Math.min(now - last, 50); last = now;
  const dir = target > t ? 1 : -1;
  t = clamp01(t + dir * dt / DUR);
  apply(t);
  if ((dir > 0 && t < target) || (dir < 0 && t > target)) raf = requestAnimationFrame(run);
  else { raf = null; last = 0; window.__t = t; }
}
const btn = document.getElementById("wrap"), st = document.getElementById("state");
btn.addEventListener("click", () => {
  const open = target < 0.5; target = open ? 1 : 0;
  btn.setAttribute("aria-pressed", String(open));
  st.innerHTML = "Crate is <b>" + (open ? "folded flat" : "closed") +
                 "</b> &middot; click to " + (open ? "unfold" : "fold");
  if (!raf) { last = 0; raf = requestAnimationFrame(run); }
});

// frame-by-frame hook: ?t=0.42 renders that instant and stops
const q = new URLSearchParams(location.search);
if (q.has("t")) { t = target = parseFloat(q.get("t")); }
manager.onLoad = () => { diag("textures loaded"); apply(t); window.__ready = true; };
manager.onProgress = (u,l,tot) => diag("  loaded " + l + "/" + tot);
manager.onError = u => diag("TEXTURE FAILED: " + String(u).slice(0, 60));
apply(t);
</script></body></html>
